<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>方块世界 · 家长控制台</title>
  <style>
    /* 控制台是独立页面，自带一套精简变量（与游戏 :root 保持同名的几个） */
    :root {
      --menu-bg: rgba(20, 24, 32, 0.92);
      --btn-bg: #4a7c59;
      --btn-bg-hover: #5b9670;
      --hud-text: #ffffff;
      --hud-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      --heart: #ef5350;
      --line: rgba(255, 255, 255, 0.14);
      --muted: #9fb0c3;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; background: #14181f; color: var(--hud-text); }
    .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 22px; }
    .card { background: var(--menu-bg); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-top: 16px; }
    input, button { font-size: 15px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); background: #1f2530; color: var(--hud-text); }
    button { background: var(--btn-bg); border-color: transparent; cursor: pointer; }
    button:hover { background: var(--btn-bg-hover); }
    button.mini { padding: 4px 8px; font-size: 13px; }
    button.warn { background: #8a4b4b; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; font-size: 14px; vertical-align: middle; }
    th { color: var(--muted); font-weight: 600; white-space: nowrap; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .muted { color: var(--muted); font-size: 13px; }
    .err { color: var(--heart); font-size: 13px; min-height: 18px; margin-top: 8px; }
    .tag { font-size: 12px; padding: 2px 6px; border-radius: 4px; background: #2a3342; white-space: nowrap; }
    .tag.lock { background: #6e2f2f; }
    .tag.off { background: #4a4a2a; }
    td.ops { white-space: nowrap; }
    td.ops input { width: 64px; padding: 4px 6px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>方块世界 · 家长控制台</h1>
    <p class="muted">幼儿防沉迷：查看当天游玩时长、设置每日上限、临时加时</p>

    <!-- 登录（用管理员账号登录） -->
    <div class="card" id="login-view">
      <div class="row">
        <input id="login-name" type="text" placeholder="管理员账号名" autocomplete="username" />
        <input id="login-pass" type="password" placeholder="密码" autocomplete="current-password" />
        <button id="login-btn">登录</button>
      </div>
      <div class="err" id="login-err"></div>
      <p class="muted">需要管理员账号（由服务端 ADMIN_NAMES 环境变量指定）。这个页面别给孩子看。</p>
    </div>

    <!-- 登录了但不是管理员 -->
    <div class="card" id="deny-view" hidden>
      <p><b id="deny-name"></b> 不是管理员账号，看不到控制台。</p>
      <button id="deny-logout">退出登录</button>
    </div>

    <!-- 主界面 -->
    <div id="main-view" hidden>
      <div class="card">
        <div class="row">
          <span>当前账号：<b id="who"></b></span>
          <span class="muted">日期 <input id="day" type="date" /></span>
          <button class="mini" id="refresh-btn">刷新</button>
          <span class="muted">每 30 秒自动刷新</span>
          <span style="flex:1"></span>
          <button class="mini warn" id="logout-btn">退出登录</button>
        </div>
      </div>
      <div class="card">
        <table>
          <thead>
            <tr><th>账号</th><th>今天已玩</th><th>剩余</th><th>每日上限</th><th>今天加时</th><th>状态</th><th>操作</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script type="module" src="/src/admin/main.ts"></script>
</body>
</html>
